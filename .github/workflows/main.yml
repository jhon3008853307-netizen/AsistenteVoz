name: Construir APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Crear proyecto
        run: |
          echo "" | base64 -d > p.zip
          unzip -q p.zip
      - name: Descargar modelo Vosk español
        run: |
          curl -L -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          unzip -q m.zip
          mv vosk-model-small-es-0.42 AsistenteVoz/app/src/main/assets/model-es
      - name: Compilar
        working-directory: AsistenteVoz
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AsistenteVoz-apk
          path: AsistenteVoz/app/build/outputs/apk/debug/*.apk
